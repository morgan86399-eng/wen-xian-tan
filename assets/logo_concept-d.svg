<svg class="brand-logo-icon" viewBox="0 0 200 200" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldNatD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="haloNatD" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(251, 191, 36, 0.35)"/>
      <stop offset="70%" stop-color="rgba(180, 83, 9, 0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="92" fill="url(#haloNatD)"/>
  
  <!-- 禪意乾坤光環 -->
  <circle cx="100" cy="100" r="86" stroke="url(#goldNatD)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="320 80" transform="rotate(-35 100 100)"/>

  <g filter="url(#glowD)">
    <!-- 東方白描拈花手型 (Graceful Buddhist Mudra Silhouette) -->
    <!-- 大拇指與食指自然相扣成圓，其餘手指如蘭花般優美舒展 -->
    <path d="M 68 180 
             C 52 165, 42 145, 44 125 
             C 46 105, 60 90, 78 88 
             C 86 87, 94 92, 94 100 
             C 94 108, 86 114, 76 112 
             C 68 110, 62 116, 62 125
             C 62 135, 72 152, 84 165
             L 84 72 
             C 84 56, 96 56, 96 72 
             L 97 115
             L 100 48 
             C 100 32, 112 32, 112 48 
             L 113 115
             L 116 62 
             C 116 48, 128 48, 128 62 
             L 127 122
             C 127 150, 112 175, 92 180 Z" 
          stroke="url(#goldNatD)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="rgba(7, 6, 20, 0.4)"/>

    <!-- 扣指中心之「天機明珠 / 太極靈眼」 -->
    <g transform="translate(86, 98)">
      <circle cx="0" cy="0" r="14" fill="rgba(7, 6, 20, 0.8)" stroke="url(#goldNatD)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="10" fill="url(#goldNatD)"/>
      <circle cx="-3" cy="-3" r="3" fill="#FFFDF7"/>
    </g>

    <!-- 靈動祥雲與星芒 -->
    <path d="M 152 42 L 154 36 L 160 34 L 154 32 L 152 26 L 150 32 L 144 34 L 150 36 Z" fill="url(#goldNatD)"/>
    <circle cx="160" cy="80" r="2.2" fill="#FDE68A"/>
    <circle cx="38" cy="70" r="2.2" fill="#FDE68A"/>
  </g>
</svg>