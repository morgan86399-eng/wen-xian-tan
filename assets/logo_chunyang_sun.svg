<svg class="brand-logo-icon" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 純陽耀金流光漸層 -->
    <linearGradient id="cySunGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#FCD34D"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- 純陽真火赤金漸層 -->
    <linearGradient id="cyFlameGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="35%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- 大日光冕光暈 -->
    <radialGradient id="cyCoronaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)"/>
      <stop offset="30%" stop-color="rgba(253, 230, 138, 0.65)"/>
      <stop offset="60%" stop-color="rgba(245, 158, 11, 0.35)"/>
      <stop offset="85%" stop-color="rgba(220, 38, 38, 0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- 柔光星辰濾鏡 -->
    <filter id="cyGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景暗金日輪底盤 -->
  <circle cx="100" cy="100" r="92" fill="#0C0A1C"/>
  <circle cx="100" cy="100" r="92" fill="url(#cyCoronaGlow)" opacity="0.65"/>
  <circle cx="100" cy="100" r="88" stroke="url(#cySunGold)" stroke-width="1.8" opacity="0.75"/>
  <circle cx="100" cy="100" r="84" stroke="url(#cySunGold)" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- 12道純陽旋轉日芒 (十二時辰乾陽真火) -->
  <g filter="url(#cyGlowFilter)">
    <!-- 日芒群 -->
    <path d="M 100 8 Q 97 22 100 28 Q 103 22 100 8 Z" fill="url(#cyFlameGold)"/>
    <path d="M 100 8 Q 97 22 100 28 Q 103 22 100 8 Z" transform="rotate(30 100 100)" fill="url(#cyFlameGold)"/>
    <path d="M 100 8 Q 97 22 100 28 Q 103 22 100 8 Z" transform="rotate(60 100 100)" fill="url(#cyFlameGold)"/>
    <path d="M 100 8 Q 97 22 100 28 Q 103 22 100 8 Z" transform="rotate(90 100 100)" fill="url(#cyFlameGold)"/>
    <path d="M 100 8 Q 97 22 100 28 Q 103 22 100 8 Z" transform="rotate(120 100 100)" fill="url(#cyFlameGold)"/>
    <path d="M 100 8 Q 97 22 100 28 Q 103 22 100 8 Z" transform="rotate(150 100 100)" fill="url(#cyFlameGold)"/>
    <path d="M 100 8 Q 97 22 100 28 Q 103 22 100 8 Z" transform="rotate(180 100 100)" fill="url(#cyFlameGold)"/>
    <path d="M 100 8 Q 97 22 100 28 Q 103 22 100 8 Z" transform="rotate(210 100 100)" fill="url(#cyFlameGold)"/>
    <path d="M 100 8 Q 97 22 100 28 Q 103 22 100 8 Z" transform="rotate(240 100 100)" fill="url(#cyFlameGold)"/>
    <path d="M 100 8 Q 97 22 100 28 Q 103 22 100 8 Z" transform="rotate(270 100 100)" fill="url(#cyFlameGold)"/>
    <path d="M 100 8 Q 97 22 100 28 Q 103 22 100 8 Z" transform="rotate(300 100 100)" fill="url(#cyFlameGold)"/>
    <path d="M 100 8 Q 97 22 100 28 Q 103 22 100 8 Z" transform="rotate(330 100 100)" fill="url(#cyFlameGold)"/>

    <!-- 次級微日冕光芒 -->
    <circle cx="100" cy="100" r="70" stroke="url(#cySunGold)" stroke-width="1.2" stroke-dasharray="6 6"/>
  </g>

  <!-- 核心乾卦 (☰ 純陽天之本源) 與太極雙儀金輪 -->
  <circle cx="100" cy="100" r="54" fill="#130F26" stroke="url(#cySunGold)" stroke-width="2.5" filter="url(#cyGlowFilter)"/>
  
  <!-- 乾卦三爻 (☰ 純金實線，每道長條厚實典雅) -->
  <g filter="url(#cyGlowFilter)">
    <!-- 上爻 -->
    <rect x="74" y="80" width="52" height="6.5" rx="3.25" fill="url(#cySunGold)"/>
    <!-- 中爻 -->
    <rect x="74" y="96.75" width="52" height="6.5" rx="3.25" fill="url(#cySunGold)"/>
    <!-- 下爻 -->
    <rect x="74" y="113.5" width="52" height="6.5" rx="3.25" fill="url(#cySunGold)"/>
  </g>

  <!-- 純陽天火金星焦點 -->
  <circle cx="100" cy="100" r="2.8" fill="#FFFFFF" filter="url(#cyGlowFilter)"/>
  <circle cx="100" cy="100" r="1.2" fill="#FEF08A"/>
</svg>
