    <!-- 飄渺星塵 -->
    <circle cx="50" cy="40" r="2.2" fill="#FDE68A"/>
    <circle cx="86" cy="32" r="1.8" fill="#FDE68A"/>
    <circle cx="165" cy="145" r="2.5" fill="#FDE68A"/>
