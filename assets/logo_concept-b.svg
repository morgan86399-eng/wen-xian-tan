             C 96 136, 122 140, 142 130 
             C 156 122, 168 108, 172 90 
             C 174 82, 168 76, 160 80 
             C 152 84, 142 94, 134 104
             C 142 90, 154 74, 158 64 
             C 160 58, 154 54, 146 58 
             C 136 64, 124 82, 118 96
             C 124 80, 134 60, 136 50 
             C 138 44, 132 40, 124 44 
             C 114 50, 102 74, 96 92
             C 100 78, 108 58, 108 48 
             C 108 42, 102 40, 96 46 
             C 86 56, 76 86, 72 108
             C 62 110, 52 116, 44 126 
             C 36 136, 38 152, 46 172 Z" 
          stroke="url(#goldNatB)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="rgba(7, 6, 20, 0.4)"/>

    <!-- 手掌自然肌理弧線 -->
    <path d="M 72 108 C 82 122, 102 132, 124 128" stroke="url(#goldNatB)" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

