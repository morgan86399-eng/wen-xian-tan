    <filter id="glowB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="92" fill="url(#haloNatB)"/>
