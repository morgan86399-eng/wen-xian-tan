<svg class="brand-logo-icon" viewBox="0 0 200 200" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 高動態範圍奢華黃金漸層 -->
    <linearGradient id="brandGoldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#FFF8DB"/>
      <stop offset="35%" stop-color="#FDE68A"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="88%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- 柔光香檳金輔助漸層 -->
    <linearGradient id="champagneGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FFFDF7"/>
    </linearGradient>

    <!-- 多層次宇宙命理靈氣光暈 -->
    <radialGradient id="brandHaloLuxury" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 248, 219, 0.5)"/>
      <stop offset="35%" stop-color="rgba(245, 158, 11, 0.38)"/>
      <stop offset="70%" stop-color="rgba(139, 92, 246, 0.18)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <radialGradient id="starCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)"/>
      <stop offset="40%" stop-color="rgba(253, 230, 138, 0.6)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- 頂級珠寶級精緻立體濾鏡 -->
    <filter id="masterGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#F59E0B" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#FFF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. 背景宇宙光環 -->
  <circle cx="100" cy="100" r="94" fill="url(#brandHaloLuxury)"/>

  <!-- 2. 外層瑞士鐘錶級「十二星盤星軌神聖環」 -->
  <circle cx="100" cy="100" r="90" stroke="url(#brandGoldLuxury)" stroke-width="1.4" opacity="0.65"/>
  <circle cx="100" cy="100" r="85" stroke="url(#brandGoldLuxury)" stroke-width="0.7" stroke-dasharray="2 4" opacity="0.75"/>
  
  <!-- 12 星座方位微刻度 (Astrolabe Ticks) -->
  <g stroke="url(#brandGoldLuxury)" stroke-width="1.2" opacity="0.7">
    <line x1="100" y1="8" x2="100" y2="13"/>
    <line x1="100" y1="187" x2="100" y2="192"/>
    <line x1="8" y1="100" x2="13" y2="100"/>
    <line x1="187" y1="100" x2="192" y2="100"/>
    <line x1="145" y1="22" x2="142.5" y2="26.3"/>
    <line x1="55" y1="178" x2="57.5" y2="173.7"/>
    <line x1="55" y1="22" x2="57.5" y2="26.3"/>
    <line x1="145" y1="178" x2="142.5" y2="173.7"/>
    <line x1="178" y1="55" x2="173.7" y2="57.5"/>
    <line x1="22" y1="145" x2="26.3" y2="142.5"/>
    <line x1="22" y1="55" x2="26.3" y2="57.5"/>
    <line x1="178" y1="145" x2="173.7" y2="142.5"/>
  </g>

  <!-- 天體黃道傾角星軌 (Ecliptic Orbit Ring) -->
  <ellipse cx="100" cy="103" rx="86" ry="34" transform="rotate(-23 100 103)" stroke="url(#brandGoldLuxury)" stroke-width="1.1" stroke-dasharray="3 4" opacity="0.5"/>

  <!-- 3. 極致人體工學・自然優雅流金手型 (Master Natural Palm Silhouette) -->
  <g filter="url(#masterGlow)">
    <!-- 手掌優雅外廓 (流暢貝茲曲線：拇指微展、中指修長、指縫自然、大魚際肌理起伏) -->
    <path d="M 82 182 
             C 68 172, 48 152, 45 130 
             C 43 114, 49 102, 56 96 
             C 62 92, 68 96, 71 105 
             C 74 113, 76 120, 78 124
             L 78 64 
             C 78 50, 89 50, 89 64 
             L 90 106
             L 91 38 
             C 91 23, 102 23, 102 38 
             L 103 102
             L 105 46 
             C 105 32, 116 32, 116 46 
             L 116 104
             L 118 74 
             C 118 62, 128 62, 128 74 
             L 127 120 
             C 127 148, 116 174, 98 182 
             Z" 
          stroke="url(#brandGoldLuxury)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(10, 8, 25, 0.45)"/>

    <!-- 手腕托環與神聖基座 -->
    <path d="M 80 183 C 90 186, 100 186, 108 183" stroke="url(#brandGoldLuxury)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <!-- 4. 自然命理三大主線 + 吉祥靈紋 (Life, Head, Heart Lines) -->
    <!-- 生命線 (流暢環抱大魚際) -->
    <path d="M 75 120 C 79 136, 85 156, 89 176" stroke="url(#champagneGold)" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
    
    <!-- 智慧線 (橫向舒展、吉星分叉) -->
    <path d="M 75 122 C 89 128, 107 136, 120 142" stroke="url(#champagneGold)" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
    
    <!-- 感情線 (優雅微曲、鳳尾吉兆) -->
    <path d="M 124 112 C 110 106, 96 106, 86 94" stroke="url(#champagneGold)" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
    <!-- 感情線鳳尾分叉 -->
    <path d="M 94 100 C 90 94, 88 88, 86 84" stroke="url(#champagneGold)" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>

    <!-- 命運中軸光芒 (Destiny Light Axis) -->
    <line x1="97" y1="62" x2="97" y2="168" stroke="url(#brandGoldLuxury)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>

    <!-- 5. 掌心核心：八芒解碼星曜・命宮靈犀 (Prismatic 8-Point Starlight Core) -->
    <g transform="translate(97, 126)">
      <!-- 核心光圈 -->
      <circle cx="0" cy="0" r="18" fill="url(#starCoreGlow)"/>
      
      <!-- 外層放射星芒 (Radiant Rays) -->
      <line x1="0" y1="-20" x2="0" y2="20" stroke="url(#brandGoldLuxury)" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="url(#brandGoldLuxury)" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-12" y1="-12" x2="12" y2="12" stroke="url(#brandGoldLuxury)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="-12" y1="12" x2="12" y2="-12" stroke="url(#brandGoldLuxury)" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 八芒璀璨星體 -->
      <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="url(#brandGoldLuxury)"/>
      <!-- 內層四芒立體切面星 -->
      <polygon points="0,-12 3.5,0 0,12 -3.5,0" fill="#FFFDF7"/>
      <polygon points="-12,0 0,3.5 12,0 0,-3.5" fill="#FFFDF7"/>
      
      <!-- 核心神聖之眼 / 鑽石星核 -->
      <circle cx="0" cy="0" r="3.2" fill="#070614"/>
      <circle cx="0" cy="0" r="1.6" fill="#FFFFFF"/>
    </g>

    <!-- 6. 指尖星宿命穴節點與耀眼星芒 (Constellation Nodes) -->
    <!-- 拇指、食指、中指、無名指、小指節點 -->
    <circle cx="56" cy="96" r="3.2" fill="#FFFFFF" stroke="url(#brandGoldLuxury)" stroke-width="1.2"/>
    <circle cx="83" cy="54" r="3.2" fill="#FFFFFF" stroke="url(#brandGoldLuxury)" stroke-width="1.2"/>
    <circle cx="96.5" cy="27" r="3.8" fill="#FFFFFF" stroke="url(#brandGoldLuxury)" stroke-width="1.4"/>
    <circle cx="110.5" cy="36" r="3.2" fill="#FFFFFF" stroke="url(#brandGoldLuxury)" stroke-width="1.2"/>
    <circle cx="123" cy="66" r="2.8" fill="#FFFFFF" stroke="url(#brandGoldLuxury)" stroke-width="1"/>

    <!-- 7. 周圍宇宙星宿裝飾 (Celestial Sparkles) -->
    <!-- 右上主幸運星 -->
    <g transform="translate(162, 34)">
      <path d="M 0 -12 L 2.5 -3.5 L 12 0 L 2.5 3.5 L 0 12 L -2.5 3.5 L -12 0 L -2.5 -3.5 Z" fill="url(#brandGoldLuxury)"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
    <!-- 左側微星 -->
    <g transform="translate(32, 54)">
      <path d="M 0 -8 L 1.8 -2.2 L 8 0 L 1.8 2.2 L 0 8 L -1.8 2.2 L -8 0 L -1.8 -2.2 Z" fill="url(#brandGoldLuxury)"/>
    </g>
    <!-- 右下微星 -->
    <circle cx="168" cy="142" r="2.5" fill="#FDE68A"/>
    <circle cx="34" cy="148" r="2" fill="#FDE68A"/>
  </g>
</svg>