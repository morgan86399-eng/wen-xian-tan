name = "wen-xian-tan"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "wenxiantan-db"
database_id = "c4fc4525-9b98-4ba5-852c-7b121d6ab77e"

[[kv_namespaces]]
binding = "RL"
id = "86894485cae2413e989bd361762d27e3"

[vars]
ALLOW_DEV_LOGIN = "true"
BLANKAPI_BASE_URL = "https://blankapi.com/v1"
BLANKAPI_MODEL = "grok-4.5"
GEMINI_TEXT_MODEL = "gemini-3.5-flash"
